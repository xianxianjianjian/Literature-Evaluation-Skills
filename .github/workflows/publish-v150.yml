name: Publish v1.5.0 prerelease after verified main CI

on:
  workflow_run:
    workflows: ["V1 Smoke Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify exact release identity and known limitations
        id: gate
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$VERIFIED_SHA" ]]; then
            echo "Main advanced since the passed CI; no release from an older commit."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(python -c 'import json;print(json.load(open(".codex-plugin/plugin.json",encoding="utf-8"))["version"])')"
          if [[ "$version" != "1.5.0" ]]; then
            echo "Not the v1.5.0 plugin: $version; skip."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q 'Manual research-artifact acceptance remains open' docs/releases/v1.5.0-release.md; then
            echo "Known-limitations disclosure is missing; refuse publication."
            exit 1
          fi
          if git rev-parse -q --verify 'refs/tags/v1.5.0^{commit}' >/dev/null; then
            existing="$(git rev-parse 'refs/tags/v1.5.0^{commit}')"
            if [[ "$existing" != "$VERIFIED_SHA" ]]; then
              echo "v1.5.0 tag points to $existing, not validated $VERIFIED_SHA"
              exit 1
            fi
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Publish v1.5.0 with known pending human acceptance
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.5.0 >/dev/null 2>&1; then
            echo "Release v1.5.0 already exists; no duplicate created."
            exit 0
          fi
          gh release create v1.5.0 \
            --target "$VERIFIED_SHA" \
            --title "Literature Evaluation v1.5.0 — manual A/C acceptance pending" \
            --notes-file docs/releases/v1.5.0-release.md \
            --prerelease
          gh release view v1.5.0 --json tagName,isPrerelease,targetCommitish,url
