name: V1 Smoke Tests

on:
  push:
    branches:
      - phase-6-v1-hardening
      - main
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile helpers and tests
        run: python -m compileall scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate V1 repository foundation
        run: python scripts/validate_deliverables.py --repo-root .
