name: Post V1 Ref Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/post-v1-ref-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="9a2f6e4c148f82853101d706751123afd91d3f20"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          echo "Verified release commit $RELEASE_SHA is an ancestor of main."

      - name: Create and verify v1.0.0 tag
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="9a2f6e4c148f82853101d706751123afd91d3f20"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin

          if git rev-parse -q --verify "refs/tags/v1.0.0" >/dev/null; then
            TARGET="$(git rev-list -n 1 v1.0.0)"
            if [ "$TARGET" != "$RELEASE_SHA" ]; then
              echo "Existing v1.0.0 points to $TARGET, expected $RELEASE_SHA" >&2
              exit 1
            fi
            echo "v1.0.0 already exists at the expected release commit."
          else
            git tag -a v1.0.0 "$RELEASE_SHA" -m "Literature Evaluation Skills V1.0.0"
            git push origin refs/tags/v1.0.0
          fi

          TARGET="$(git rev-list -n 1 v1.0.0)"
          test "$TARGET" = "$RELEASE_SHA"
          echo "Verified v1.0.0 -> $TARGET"

      - name: Delete approved historical branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            phase-1-foundation
            phase-2-search
            phase-3-translation
            phase-4-deep-reading
            phase-5-orchestration
            phase-6-v1-hardening
            phase-7-zotero-write-adapter
            phase-8-zotero-local-attachments
            phase-9-zotero-local-parent-create
            v1-release-candidate
            post-v1-release-housekeeping
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            phase-1-foundation
            phase-2-search
            phase-3-translation
            phase-4-deep-reading
            phase-5-orchestration
            phase-6-v1-hardening
            phase-7-zotero-write-adapter
            phase-8-zotero-local-attachments
            phase-9-zotero-local-parent-create
            v1-release-candidate
            post-v1-release-housekeeping
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Branch still exists after cleanup: $branch" >&2
              exit 1
            fi
          done

          git ls-remote --exit-code --heads origin main >/dev/null
          echo "Historical refs removed; main retained."
